<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanbot — Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23F5A524'/%3E%3Cpath d='M10 21c0-6 4-10 12-11-1 8-5 12-12 11z' fill='%23151516'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var palettes = {
          grafite: ['#4a4a52', '#3e3e44', '#313136', '#262629', '#1b1b1e', '#131315'],
          ardosia: ['#4a5360', '#3e4650', '#323843', '#262c33', '#1b1f25', '#12151a'],
          marinho: ['#44526a', '#384456', '#2d3646', '#222834', '#181c25', '#0f1218'],
          vinho: ['#5a454c', '#4a393f', '#3b2e33', '#2c2327', '#1e191b', '#141011'],
          rosa: ['#7a4a5c', '#633d4c', '#4e313d', '#3a252e', '#26191f', '#161013'],
          floresta: ['#45524c', '#3a443f', '#2f3733', '#242a27', '#1a1e1c', '#111413'],
          ambar: ['#564c42', '#473f37', '#39332d', '#2b2722', '#1e1b18', '#141210'],
          ametista: ['#4e4758', '#413c4a', '#34313c', '#28262f', '#1c1b21', '#131216'],
          obsidiana: ['#3c3c44', '#313137', '#26262b', '#1c1c20', '#141416', '#0b0b0d'],
        };
        try {
          var id = localStorage.getItem('kanbot:atmosphere');
          var stops = palettes[id] || palettes.grafite;
          var root = document.documentElement;
          root.dataset.atmosphere = palettes[id] ? id : 'grafite';
          for (var i = 0; i < 6; i++) root.style.setProperty('--bg-' + i, stops[i]);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
